<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 250px; padding: 10px; font-family: sans-serif; }
    input { width: 90%; padding: 6px; margin-bottom: 8px; }
    button { width: 96%; padding: 6px; background-color: #a855f7; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #9333ea; }

<body>
  <h3>Study Goal</h3>

  <script src="popup.js"></script>
</body>
</html>
